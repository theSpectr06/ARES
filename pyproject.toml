[project]
name = "ares-pipeline"
version = "0.1.0"
description = "Terrain-aware Mars EVA route planning and geospatial analysis pipeline"
readme = "README.md"
authors = [
    { name = "theSpectr06", email = "thespectre0642@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
